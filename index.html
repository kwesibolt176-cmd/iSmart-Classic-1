    <div id="root"></div>

    <script type="module">
      (() => {
        const host = window.location.hostname;
        const isPreview =
          host === "localhost" ||
          host === "127.0.0.1" ||
          host.endsWith(".lovableproject.com") ||
          (host.startsWith("id-preview--") && host.endsWith(".lovable.app"));

        // Version key - increment to force cache clear on all browsers
        const CACHE_VERSION = "v10";
        const flagKey = `__ismartpay_sw_cleared_${CACHE_VERSION}__`;


        const cleanupServiceWorkers = async () => {
          const results = { sw: 0, caches: 0 };
          
          try {
            if ("serviceWorker" in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all((regs || []).map((r) => r.unregister()));
              results.sw = regs?.length || 0;
            }
          } catch (e) {
            console.warn("[SW Cleanup] Failed to unregister service workers:", e);
          }

          try {
            if ("caches" in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
              results.caches = keys.length;
            }
          } catch (e) {
            console.warn("[SW Cleanup] Failed to clear caches:", e);
          }

          return results;
        };

        // Always clean up in preview environments
        if (isPreview) {
          if (!sessionStorage.getItem(flagKey)) {
            sessionStorage.setItem(flagKey, "1");
            
            cleanupServiceWorkers()
              .then((results) => {
                console.log(`[SW Cleanup] Cleared ${results.sw} workers, ${results.caches} caches`);
              })
              .finally(() => {
                const url = new URL(window.location.href);
                url.searchParams.set("sw-clear", Date.now().toString());
                window.location.replace(url.toString());
              });
            return;
          }
        }

        // For production: check localStorage for version changes
        const storedVersion = localStorage.getItem("__ismartpay_cache_version__");
        if (storedVersion !== CACHE_VERSION) {
          localStorage.setItem("__ismartpay_cache_version__", CACHE_VERSION);
          
          cleanupServiceWorkers()
            .then((results) => {
              if (results.sw > 0 || results.caches > 0) {
                console.log(`[SW Cleanup] Production cleanup: ${results.sw} workers, ${results.caches} caches`);
                window.location.reload();
              }
            })
            .catch(() => {
              // Continue loading even if cleanup fails
            });
        }

      })();
    </script>
